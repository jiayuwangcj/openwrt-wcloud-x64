name: OpenWrt CI

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

# Single source of truth for the reviewed stable release and its upstream feeds.
env:
  OPENWRT_REF: v25.12.6
  OPENWRT_COMMIT: 64900e756efa667774214f9c6b17c113222e01f7
  TZ: Asia/Shanghai

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test scripts and firmware validation
        run: bash ci/test.sh

      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck=

      - name: Install configuration check dependencies
        run: bash ci/install-deps.sh check

      - name: Verify stable source, feed pins and resolved configuration
        run: bash ci/prepare-source.sh "$RUNNER_TEMP/openwrt" "$RUNNER_TEMP/diagnostics"

      - name: Upload configuration diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwrt-checks-${{ github.run_id }}
          path: ${{ runner.temp }}/diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  release-tag:
    name: Reserve release tag
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[publish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout tag preparation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reserve and verify the build source tag before compilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/release-tag.sh prepare

  build:
    name: Build firmware
    needs: [check, release-tag]
    # Only a marked master push that passes Checks can compile firmware.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[publish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    # Scope concurrency to expensive builds so checks never wait behind them.
    concurrency:
      group: openwrt-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install firmware build dependencies
        run: bash ci/install-deps.sh build

      - name: Prepare the same pinned configuration verified by Checks
        run: bash ci/prepare-source.sh "$RUNNER_TEMP/openwrt" "$RUNNER_TEMP/diagnostics"

      - name: Download sources and compile firmware
        run: bash ci/compile-firmware.sh "$RUNNER_TEMP/openwrt" "$RUNNER_TEMP/diagnostics"

      - name: Verify firmware and attach provenance
        run: |
          bash ci/stage-firmware.sh "$RUNNER_TEMP/openwrt" "$RUNNER_TEMP/firmware"
          cp "$RUNNER_TEMP/diagnostics/"{resolved.config,diffconfig,openwrt-commit,feed-commits,feeds.conf.pinned,build-provenance.txt} \
            "$RUNNER_TEMP/firmware/"

      - name: Upload verified firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwrt-${{ env.OPENWRT_REF }}-x86-64-${{ github.run_id }}
          path: ${{ runner.temp }}/firmware/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwrt-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only tag reservation and publication have repository write permission.
    permissions:
      contents: write
    steps:
      - name: Checkout publication script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified firmware from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openwrt-${{ env.OPENWRT_REF }}-x86-64-${{ github.run_id }}
          path: firmware
          digest-mismatch: error

      - name: Verify provenance and checksums, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/publish-release.sh firmware
