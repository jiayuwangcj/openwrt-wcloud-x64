name: Build OpenWrt

on:
  workflow_dispatch:
  push:
    branches: [master, build/openwrt-25.12.5]
    paths: [config, 'ci/**', 'files/**', 'diy-part*.sh', .github/workflows/build-openwrt.yml]

permissions:
  contents: read

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENWRT_REF: v25.12.5
  OPENWRT_COMMIT: f0a60eee2fe051741c643ea6118718aae1ef17fb
  TZ: Asia/Shanghai

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test build harness without compiling firmware
        run: bash ci/test.sh

      - name: Prepare supported build environment
        run: |
          set -euo pipefail
          # Only disposable SDKs on GitHub's hosted VM, never local/router files.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates patch diffutils findutils perl time jq xz-utils \
            zstd bzip2 cpio squashfs-tools libelf-dev libzstd-dev
          mkdir -p "$RUNNER_TEMP/openwrt-diagnostics"
          df -h

      - name: Clone exact stable release
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$OPENWRT_REF" \
            https://github.com/openwrt/openwrt.git "$RUNNER_TEMP/openwrt"
          test "$(git -C "$RUNNER_TEMP/openwrt" rev-parse HEAD)" = "$OPENWRT_COMMIT"
          cp "$RUNNER_TEMP/openwrt/feeds.conf.default" \
            "$RUNNER_TEMP/openwrt-diagnostics/feeds.conf.pinned"

      - name: Install release-pinned feeds
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/diy-part1.sh"
          ./scripts/feeds update -a 2>&1 | tee "$RUNNER_TEMP/openwrt-diagnostics/feeds-update.log"
          ./scripts/feeds install -a 2>&1 | tee "$RUNNER_TEMP/openwrt-diagnostics/feeds-install.log"

      - name: Resolve and validate configuration
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/config" .config
          if [[ -d "$GITHUB_WORKSPACE/files" ]]; then
            mkdir -p files
            cp -a "$GITHUB_WORKSPACE/files/." files/
          fi
          bash "$GITHUB_WORKSPACE/diy-part2.sh"
          make defconfig 2>&1 | tee "$RUNNER_TEMP/openwrt-diagnostics/defconfig.log"
          cp .config "$RUNNER_TEMP/openwrt-diagnostics/resolved.config"
          ./scripts/diffconfig.sh > "$RUNNER_TEMP/openwrt-diagnostics/diffconfig"
          git rev-parse HEAD > "$RUNNER_TEMP/openwrt-diagnostics/openwrt-commit"
          for feed in packages luci routing telephony video; do
            git -C "feeds/$feed" rev-parse HEAD
          done > "$RUNNER_TEMP/openwrt-diagnostics/feed-commits"
          bash "$GITHUB_WORKSPACE/ci/validate-config.sh" "$GITHUB_WORKSPACE/config" .config

      - name: Download sources
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          set -euo pipefail
          make download -j8 V=s 2>&1 | tee "$RUNNER_TEMP/openwrt-diagnostics/download.log"

      - name: Compile firmware on GitHub only
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          set -euo pipefail
          make -j"$(nproc)" V=s 2>&1 | tee "$RUNNER_TEMP/openwrt-diagnostics/build.log" || \
            make -j1 V=s 2>&1 | tee "$RUNNER_TEMP/openwrt-diagnostics/build-retry.log"

      - name: Verify and stage firmware
        run: |
          set -euo pipefail
          bash ci/stage-firmware.sh "$RUNNER_TEMP/openwrt" "$RUNNER_TEMP/openwrt-firmware"
          cp "$RUNNER_TEMP/openwrt-diagnostics/"{resolved.config,diffconfig,openwrt-commit,feed-commits,feeds.conf.pinned} \
            "$RUNNER_TEMP/openwrt-firmware/"
          printf 'Configuration commit: %s\nOpenWrt: %s (%s)\n' \
            "$GITHUB_SHA" "$OPENWRT_REF" "$OPENWRT_COMMIT" \
            > "$RUNNER_TEMP/openwrt-firmware/build-provenance.txt"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwrt-${{ env.OPENWRT_REF }}-x86-64-${{ github.run_id }}
          path: ${{ runner.temp }}/openwrt-firmware/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwrt-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/openwrt-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          printf '### OpenWrt firmware build\n\n- Release: `%s`\n- Source: `%s`\n- Runner: Ubuntu 24.04\n- This workflow never deploys to routers.\n' \
            "$OPENWRT_REF" "$OPENWRT_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          df -h >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish verified firmware release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openwrt-${{ env.OPENWRT_REF }}-x86-64-${{ github.run_id }}
          path: firmware

      - name: Verify downloaded firmware checksums
        working-directory: firmware
        run: sha256sum -c --ignore-missing sha256sums

      - name: Publish images and provenance to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${OPENWRT_REF}-x86-64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          OpenWrt ${OPENWRT_REF}, x86-64, built from pinned source ${OPENWRT_COMMIT}.

          Includes standard kernel WireGuard, wireguard-tools and LuCI protocol support.
          Firmware manifests and SHA256 checksums passed CI validation.
          BIOS: *-combined.img.gz; UEFI: *-combined-efi.img.gz.
          Verify downloads against sha256sums before use.

          Build configuration: ${GITHUB_SHA}
          Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This image has not been boot-tested on your devices. Production highflowd,
          highflow-helper and private tunnel configuration are not included.
          Test major-version upgrades in an isolated VM before deployment.
          EOF
          gh release create "$tag" firmware/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OpenWrt ${OPENWRT_REF} x86-64 (build ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT})" \
            --notes-file "$notes" --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          printf '\nRelease: https://github.com/%s/releases/tag/%s\n' \
            "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
