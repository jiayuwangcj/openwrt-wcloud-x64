name: Check upstream stable release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Show latest upstream release (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/openwrt/openwrt/releases/latest \
            --jq '{tag_name, published_at, html_url}' | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'Builds use a reviewed pinned release; this check does not update or dispatch builds.' >> "$GITHUB_STEP_SUMMARY"
