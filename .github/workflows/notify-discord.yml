name: Discord CI notifications

on:
  workflow_run:
    workflows: [OpenWrt CI, Build OpenWrt, Check upstream stable release]
    types: [in_progress, completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    name: Notify private CI topic
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # workflow_run has access to secrets. Use only trusted default-branch code,
      # never the triggering PR/branch checkout or its artifacts.
      - name: Checkout trusted notification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Send allowlisted CI status to Discord
        env:
          DISCORD_CI_WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/notify_discord.py
